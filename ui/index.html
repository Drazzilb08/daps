<!doctype html>
<html lang="en">
  <head>
    <!-- Theme script (before any CSS so theme is set early) -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t) {
          document.documentElement.setAttribute('data-theme', t);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAPS</title>

    <!-- Favicons -->
    <link rel="icon" href="/img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon-colored.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="mask-icon" href="/img/mask-icon.svg" color="#5bbad5" />

    <!-- Material Icons for sidebar/menu -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <!-- React/Vite will inject all JS/CSS needed below -->
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
